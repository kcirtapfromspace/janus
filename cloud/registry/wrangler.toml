# The shared question registry: a Worker in front of a D1 database (cloud/registry/README.md).
name = "janus-registry"
main = "src/index.js"
compatibility_date = "2026-04-01"

[[d1_databases]]
binding = "DB"
database_name = "janus-registry"
# From `wrangler d1 create janus-registry` (not a secret).
database_id = "7d5af658-95f1-4702-bb02-9722d093cc0f"

[vars]
# Contributions accepted per day, across every install, and per install: they protect the free
# tier's write quota. Moderation is what keeps the registry clean.
DAILY_CAP = "2000"
INSTALL_DAILY_CAP = "100"
